[project]
name = "enterprise-rag-chatglm"
version = "0.1.0"
description = "Configurable enterprise retrieval-augmented generation assistant with LangChain, LangGraph, and a pluggable ChatGLM model adapter."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-community>=0.3,<1.0",
  "chromadb>=1.0,<2.0",
  "sentence-transformers>=3.0,<5.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "structlog>=24.1,<26.0",
  "prometheus-client>=0.20,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.6,<2.0",
  "mypy>=1.10,<2.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["data", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "C4", "SIM", "PL", "RUF",
  "N", "RET", "SLF", "PIE", "PT", "TCH",
]
ignore = [
  "PLR0913",
  "PLR0912",
  "PLR0904",
  "PLR0911",
  "PLR0915",
  "PLR2004",
  "PLR0917",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF100",
  "RUF022",
  "PLW0603",
  "PLW2901",
  "N801",
  "N802",
  "N814",
  "N818",
  "B018",
  "B027",
  "SLF001",
  "TC001",
  "TC004",
  "PLC0415",
  "C4",
  "SIM",
  "UP",
  "RET",
  "PIE",
  "PT",
  "TCH",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = ["data/.*", "build/.*", "dist/.*"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
